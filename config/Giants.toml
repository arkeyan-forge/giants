# XenonRecomp config for Skylanders: Giants (Xbox 360, title 415608DA).
# Helper addresses from tools/sigmatch (all confidence 1.0); functions and switch tables from tools/find_switch_tables.py
# (pass 1 without, pass 2 with the pass-1 mapping, merged). Paths are relative to this file laid out as the
# kit does (config/Giants.toml, private/default.xex, ppc/): Arkeyan-Builder builds that layout from the player's disc, and
# tools/prepare_game.sh does the same for the workshop. Output: ppc/ (private/giants/ppc in the workshop).
# Giants has no C++ EH (no FuncInfo magic 0x1993052x in the image): only the SEH handler thunk precedes functions.
[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "Giants_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
# Functions XenonRecomp keeps in the context (every register a PPCContext field): they read a register their caller
# set outside the ABI. Written by tools/xenonrecomp/local_reads.py --toml (docs/tools/toolchain/xenonrecomp.md).
context_functions = [
    0x82169318, 0x822CDDA0, 0x822CE418, 0x822CE570, 0x822CEEA8, 0x8240A834, 0x8240AD00, 0x8240B090,
    0x824544B0, 0x82456160, 0x82456920, 0x82461180, 0x824B1EF8, 0x8257A228, 0x825D18C8, 0x825E00C4,
    0x825E6978, 0x825EB320, 0x825EB5C4, 0x82608880,
]

restgprlr_14_address = 0x825DF9F0
savegprlr_14_address = 0x825DF9A0
restfpr_14_address = 0x825E066C
savefpr_14_address = 0x825E0620
restvmx_14_address = 0x825E0388
savevmx_14_address = 0x825E00F0
restvmx_64_address = 0x825E041C
savevmx_64_address = 0x825E0184

# longjmp: restores f14-f31/r13-r31 from the jmp_buf, calls RtlUnwind when an unwind func is set.
longjmp_address = 0x825DD6A0
# setjmp: mirror stores (stfd f14, 0(r3) ...) behind a hook-pointer check.
setjmp_address = 0x82608880

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x8261B870, size = 8 }, # __C_specific_handler (import thunk) + scope table, before SEH functions
]

# Non-.pdata functions XenonRecomp's analyzer can't size (jump tables, bdz chains, adapters that `b` into the next function,
# vtable targets merged into a neighbour, leaf functions packed together).
